# This is a basic workflow to help you get started with Actions

name: DemoWorkflow

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "feature-**" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Get data on workflow run
  workflow_data:
    runs-on: ubuntu-latest

    steps:
      - name: Print event that triggered the worklfow
        run: echo "Workflow triggered by event ${{github.event_name}}"
      - name: Print branch details
        run: | 
          # github.head_ref is the source of the branch of the pull request. Only set when there is a pull request
          # echo "Pull request source branch: ${github.head_ref}"
          # github)ref is the fully-formed reference (eg refs/heads/main_ of the branch or tag that triggered the workflow run for push events. Format chanes for PRs
          echo "Current branch: {$GITHUB_REF}"
          # using string manipulation we can remove ref/heads with '##' leaving just the branch name
          echo "Current branch: ${GITHUB_REF##*/}"
          # or we can just use the short name
          echo "Github_ref_name: ${GITHUB_REF_NAME}"
          # How about who triggered the workflow run?
          echo "Workflow triggered by: ${{github.actor}}"

      

  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
      
